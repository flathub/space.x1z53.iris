id: space.x1z53.iris
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: iris
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --socket=wayland
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/vala
modules:
  - name: libcassette
    buildsystem: meson
    config-opts:
      - -Dlib_only=true
      - -Dinstall_lib_s=true
    builddir: true
    sources:
      - type: git
        url: https://altlinux.space/rirusha/Cassette.git
        commit: 264ea72568cbc65bcfd350fb804b6d8c00def664

  - name: api-base
    buildsystem: meson
    builddir: true
    sources:
      - type: git
        url: https://altlinux.space/rirusha/libapi-base.git
        tag: v7.5
        commit: 31dc17a6bdd5989619e6a1070f322b9655bd5d75

  - name: iris
    buildsystem: meson
    builddir: true
    sources:
      - type: git
        url: https://altlinux.space/alt-gnome/iris.git
        tag: 0.2.4.1
        commit: a0dc0ded93ba81df38a6d57c368c93ff788e7678
        x-checker-data:
          tag-pattern: ^([\d.]+)$
          type: git
